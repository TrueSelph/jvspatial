name: Publish release candidate to TestPyPI

on:
  push:
    tags:
      - 'v*rc*'

permissions:
  contents: read

jobs:
  publish-testpypi:
    name: Build and publish release candidate to TestPyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)

    steps:
      - name: Check out tagged candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify candidate version matches tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' jvspatial/version.py)
          if [ -z "$VERSION" ]; then
            echo "Error: could not read __version__ from jvspatial/version.py"
            exit 1
          fi
          EXPECTED_TAG="v${VERSION}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$'; then
            echo "Error: expected a release candidate version (for example 0.2.0rc1), got $VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match version.py ($EXPECTED_TAG)"
            exit 1
          fi
          echo "Publishing candidate $VERSION from $GITHUB_REF_NAME"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jvspatial-${{ github.ref_name }}
          path: dist/
          retention-days: 30
