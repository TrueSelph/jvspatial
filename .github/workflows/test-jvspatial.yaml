name: Test jvspatial

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    # MongoDB 8 refuses the newer runner kernels (SERVER-121912).
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jvspatial
          POSTGRES_PASSWORD: jvspatial  # pragma: allowlist secret
          POSTGRES_DB: jvspatial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jvspatial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JVSPATIAL_POSTGRES_TEST_DSN: postgresql://jvspatial:jvspatial@localhost:5432/jvspatial  # pragma: allowlist secret
      JVSPATIAL_SHALLOW_DELETE_TEST_DSN: postgresql://jvspatial:jvspatial@localhost:5432/jvspatial_shallow_delete  # pragma: allowlist secret
      JVSPATIAL_PROJECTION_TEST_DSN: postgresql://jvspatial:jvspatial@localhost:5432/jvspatial  # pragma: allowlist secret
      JVSPATIAL_MONGODB_TEST_URI: mongodb://localhost:27017
      JVSPATIAL_PROJECTION_MONGO_URI: mongodb://localhost:27017
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install content-detection dependency
      run: sudo apt-get update && sudo apt-get install -y libmagic1

    - name: Create isolated shallow-deletion test database
      env:
        PGPASSWORD: jvspatial  # pragma: allowlist secret
      run: psql -h localhost -U jvspatial -d jvspatial -c 'CREATE DATABASE jvspatial_shallow_delete'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Install jvspatial package with test, lambda, and postgres dependencies
      # Exercise translators and live isolated PostgreSQL/MongoDB integration
      # tests, including projections, on every supported matrix Python version.
      run: pip install -e '.[test,lambda,postgres,pgvector]'

    - name: Verify content-based MIME detection is active
      run: python -c "from jvspatial.storage.security.validator import HAS_MAGIC; assert HAS_MAGIC"

    # Coverage on every matrix Python version spikes memory (~1.6k tests); the runner often OOM-kills
    # the process (shown as "The operation was canceled"). Run full suite everywhere; enforce
    # coverage threshold once on 3.12.
    - name: Run tests (with coverage)
      if: matrix.python-version == '3.12'
      # Coverage floor bumped to 60% after Phase A1-A5/B1-B3/C1-C2 added
      # ~80 new tests covering durability, transactions, push-down,
      # caching, observability, retry, bulk APIs, multipart S3.
      # Tighten further once flake risk is understood under the new suite.
      run: pytest tests/ -v --tb=short --cov=jvspatial --cov-report=xml --cov-report=term-missing --cov-fail-under=60

    - name: Run tests (no coverage)
      if: matrix.python-version != '3.12'
      run: pytest tests/ -v --tb=short
    # Pre-commit runs once in .github/workflows/pre-commit.yaml (same triggers); omit here to avoid 3× duplicate work.
